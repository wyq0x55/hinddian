<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1a1a1e" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="hinddian" />
  <title>hinddian · 笔记管线</title>
  <link rel="manifest" href="/static/manifest.webmanifest" />
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/static/icon-180.png" />
  <link rel="stylesheet" href="/static/styles.css?v=33" />
</head>
<body>
  <header class="top">
    <div class="top-in">
      <div class="brand">
        <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 21 7v10l-9 5-9-5V7z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>
        <div><h1>hinddian</h1><p class="sub">Obsidian 笔记管线</p></div>
      </div>
      <span class="grow"></span>
      <span id="health" class="pill">…</span>
      <button type="button" id="refresh" class="btn" aria-label="刷新"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>刷新</span></button>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="页面">
    <a href="#pipeline" data-tab="pipeline"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg><span>流水线</span></a>
    <a href="#drafts" data-tab="drafts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg><span>草稿</span><b class="badge muted" id="badge-drafts" hidden></b></a>
  </nav>

  <main class="page">
    <!-- 流水线: nodes on a grid, SVG wires measured from the DOM -->
    <section class="view" id="view-pipeline" hidden>
      <div class="rt">
        <div class="rt-top">
          <div class="rt-what"><b>流水线</b> · 会话 → Jev 过滤 → 草稿 → 批处理 → Obsidian</div>
          <p class="rt-mode" id="rt-mode">—</p>
        </div>
        <div class="rt-stage" id="stage">
          <svg class="rt-wires" id="wires" aria-hidden="true"></svg>
          <div class="rt-node lane-m" data-n="hooks" style="grid-area:hooks"><span class="dot muted"></span><b>会话</b><strong>hooks</strong><small>每台电脑 · 每轮缓冲</small></div>
          <div class="rt-node rt-hub" data-n="jev" style="grid-area:jev"><b>Jev 过滤</b><small>会话结束时</small><i>值不值得记</i></div>
          <a class="rt-node lane-b" data-n="drafts" style="grid-area:drafts" href="#drafts"><span class="dot accent"></span><b>草稿·按项目</b><strong id="n-drafts">—</strong><small id="drafts-by">—</small></a>
          <div class="rt-node rt-hub" data-n="analysis" style="grid-area:analysis"><b>批处理</b><small>自动整理</small></div>
          <div class="rt-node lane-o" data-n="obsidian" style="grid-area:obsidian"><span class="dot green"></span><b>Obsidian</b><strong id="n-notes">—</strong><small id="notes-by">原子笔记</small></div>
        </div>
        <div class="rt-foot">
          <p class="rt-cap" id="rt-cap">—</p>
          <div class="rt-legend"><span><i class="lg"></i>已接通</span><span><i class="lg dash"></i>空闲</span><span><i class="lg flow"></i>有积压在流动</span></div>
        </div>
      </div>
      <footer class="foot"><span>技巧 → <code>技巧/</code>（一条一个文件）</span><span id="version"></span></footer>
    </section>

    <section class="view narrow" id="view-drafts" hidden>
      <section class="card">
        <header class="card-h"><h2>Jev 判断记录</h2><span class="note">每次 finalize 的结果</span><span class="grow"></span><span class="count" id="jev-count">—</span></header>
        <div class="card-b"><div class="meta" id="jev-summary">加载中…</div><div id="jev-list"><p class="empty">加载中…</p></div></div>
      </section>
      <section class="card">
        <header class="card-h"><h2>待处理会话草稿</h2><span class="grow"></span><span class="count" id="draft-list-count">—</span></header>
        <div class="card-b" id="draft-list"><p class="empty">加载中…</p></div>
      </section>
      <section class="card">
        <header class="card-h"><h2>最近已处理</h2><span class="note">批处理后移到 processed/ 的会话草稿</span><span class="grow"></span><span class="count" id="draft-processed-count">—</span></header>
        <div class="card-b" id="draft-processed"><p class="empty">加载中…</p></div>
      </section>
      <section class="card">
        <header class="card-h"><h2>批处理进度</h2><span class="grow"></span><span class="count" id="batch-count">—</span></header>
        <div class="card-b" id="batch"><p class="empty">加载中…</p></div>
      </section>
    </section>
  </main>

  <dialog id="sheet" class="sheet">
    <div class="sheet-head"><span id="sheet-kind" class="chip"></span><span class="grow"></span>
      <button type="button" class="btn icon" id="sheet-close" aria-label="关闭"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
    <div id="sheet-body" class="sheet-body"></div>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="/static/app.js?v=33"></script>
</body>
</html>
