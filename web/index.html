<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#141416" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="hinddian" />
  <title>hinddian</title>
  <link rel="manifest" href="/static/manifest.webmanifest" />
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/static/icon-180.png" />
  <link rel="stylesheet" href="/static/styles.css?v=20" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 21 7v10l-9 5-9-5V7z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>
      <h1>hinddian</h1>
      <span id="health" class="health" title="服务状态"></span>
    </div>
    <button type="button" id="refresh" class="icon-btn" aria-label="刷新">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </header>

  <nav class="tabs" id="tabs" aria-label="页面">
    <a href="#review" data-tab="review"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 12l2 2 4-4M12 3l8 4v5c0 5-3.4 8.3-8 9-4.6-.7-8-4-8-9V7z"/></svg><span>待批准</span><b class="badge" id="badge-review" hidden></b></a>
    <a href="#notes" data-tab="notes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l3 3v15H6zM9 9h6M9 13h6M9 17h4"/></svg><span>笔记</span></a>
    <a href="#drafts" data-tab="drafts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg><span>草稿</span><b class="badge muted" id="badge-drafts" hidden></b></a>
    <a href="#overview" data-tab="overview"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V10M10 19V5M16 19v-7M22 19H2"/></svg><span>概览</span></a>
  </nav>

  <main class="page">
    <section class="view" id="view-review" hidden>
      <h2 class="vh">Agent 修正</h2>
      <p class="hint">Agent 想改动 decision 时，一律先排在这里，你批准后才写入 Obsidian。</p>
      <div id="corrections" class="stack"><p class="empty">加载中…</p></div>
      <h2 class="vh">等待批量分析的项目</h2>
      <p class="hint">新项目攒够会话草稿后，要你点一次「开始」；之后的新草稿会自动增量合并。</p>
      <div id="ready" class="stack"><p class="empty">加载中…</p></div>
    </section>

    <section class="view" id="view-notes" hidden>
      <form id="search" class="search" role="search">
        <input id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="问记忆：和 Agent 自动召回同一套检索" />
      </form>
      <div class="filters">
        <div class="seg" id="type-seg" role="group" aria-label="类型">
          <button type="button" data-type="" class="on">全部</button>
          <button type="button" data-type="decision">决策</button>
          <button type="button" data-type="lesson">经验</button>
          <button type="button" data-type="tip">技巧</button>
        </div>
        <select id="project" aria-label="项目"><option value="">所有项目</option></select>
      </div>
      <p class="hint" id="notes-hint"></p>
      <div id="notes" class="list"><p class="empty">加载中…</p></div>
    </section>

    <section class="view" id="view-drafts" hidden>
      <h2 class="vh">会话草稿（按项目）</h2>
      <p class="hint">每个会话结束后由 hooks 整理成一份草稿；批处理把草稿合并进原子笔记。</p>
      <div id="gate" class="stack"><p class="empty">加载中…</p></div>
    </section>

    <section class="view" id="view-overview" hidden>
      <div class="kpis" id="kpis"></div>
      <h2 class="vh">流水线</h2>
      <ol class="flow" id="flow"></ol>
      <p class="foot" id="version"></p>
    </section>
  </main>

  <dialog id="sheet" class="sheet">
    <div class="sheet-head"><span id="sheet-kind" class="chip"></span><span class="grow"></span>
      <button type="button" class="icon-btn" id="sheet-close" aria-label="关闭"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
    <div id="sheet-body" class="sheet-body"></div>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="/static/app.js?v=20"></script>
</body>
</html>
