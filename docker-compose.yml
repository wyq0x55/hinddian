# Optional local stub — not required for ./scripts/run_dev.sh
services:
  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
      - ./data:/app/data
    command: bash -c "pip install -r requirements.txt && ./scripts/run_dev.sh"
    ports:
      - "8787:8787"
    environment:
      HINDDIAN_HOST: "0.0.0.0"
      HINDDIAN_PORT: "8787"
      HINDDIAN_ALLOW_NO_AUTH: "true"  # local stub only — never in production
      STATUS_DB: "/app/data/hinddian.db"
