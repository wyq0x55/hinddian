# One-shot: set vault CLI scripts to git 100755, then delete this workflow.
name: once-chmod-vault-cli
on:
  push:
    branches: [fix/vault-cli-executable]
    paths: [.github/workflows/once-chmod-vault-cli.yml]

permissions:
  contents: write

jobs:
  chmod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vault-cli-executable
          fetch-depth: 0
      - name: Mark scripts 100755 and remove this workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git update-index --chmod=+x \
            classify/hinddian_batch.py \
            deploy/vault-host/hinddian-memory-cli \
            classify/deploy/install-vault-host.sh
          git rm -f .github/workflows/once-chmod-vault-cli.yml
          if git diff --cached --quiet; then
            echo "nothing to commit"; git ls-files -s classify/hinddian_batch.py deploy/vault-host/hinddian-memory-cli classify/deploy/install-vault-host.sh; exit 0
          fi
          git commit -m "chore(vault): git 100755 for batch/CLI/install scripts"
          git push origin HEAD:fix/vault-cli-executable
